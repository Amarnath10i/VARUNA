model:
  raincast:
    in_channels: 5
    hidden: 64
    n_blocks: 4
    modes1: 16
    modes2: 16
    horizon: 3
  hydronet:
    num_nodes: 12
    node_feat_dim: 8
    hidden: 64
    n_gnn_layers: 2
  floodmap:
    img_size: 128
    sar_chans: 2
    opt_chans: 3
    embed_dim: 192
    depth: 6
    nhead: 6
    mask_ratio: 0.6

uncertainty:
  alpha: 0.10          # 90% conformal coverage
  crps_weight: 1.0
  nll_weight: 1.0

data:
  era5_region: [30.0, 73.0, 20.0, 90.0]   # [lat_max, lon_min, lat_min, lon_max]
  era5_years: [2018, 2019, 2020, 2021, 2022, 2023]
  sentinel_bbox: [73.0, 20.0, 90.0, 30.0]

regions:
  - region_id: "Kaziranga-Brahmaputra"
    discharge_threshold: 45000.0
    rainfall_threshold_mm: 200.0
    flood_cover_fraction: 0.20
    lead_days: 3
    coverage_alpha: 0.90
    payout_per_event: 5000.0
  - region_id: "Bihar-Koshi"
    discharge_threshold: 32000.0
    rainfall_threshold_mm: 180.0
    flood_cover_fraction: 0.25
    lead_days: 2
    coverage_alpha: 0.90
    payout_per_event: 4000.0